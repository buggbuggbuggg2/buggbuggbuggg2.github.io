<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mock Business</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="mock business project for design 101" content="" />
  <link rel="icon" href="favicon.png">

<style>
    .parent {
    display: grid;
    grid-template-columns: repeat(12, 1fr);
    grid-template-rows: repeat(12, 1fr);
    gap: 8px;
    background-color: #FCAF9F;
}
    
.div2 {
    grid-column: span 10 / span 10;
    grid-row: span 2 / span 2;
    grid-column-start: 2;
}

.div3 {
grid-column: span 8 / span 8;
grid-row: span 10 / span 10;
grid-column-start: 4;
grid-row-start: 3;
}

.div4 {
grid-column: span 2 / span 2;
grid-row: span 10 / span 10;
grid-column-start: 2;
 grid-row-start: 3;
}
</style>
</head>
<body>
    <div class="parent">

        <div class="div2">  
            <h1>Mock Business</h1>
    </div>
    
    <div class="div3">
        3
    </div>

    <div class="div4">
        4
    </div>
</div>
</body>
</html>
